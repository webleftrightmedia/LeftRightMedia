services:
  - type: web
    name: leftrightmedia-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://leftrightmedia.in
      - key: MONGO_URI
        sync: false
      - key: PORT
        value: 5000
